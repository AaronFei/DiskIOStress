# RANDOM writes across UNGRACEFUL (surprise) power cuts (volatile durability).
ranges         = 0-4G
access         = random
io_size        = 64K
qd             = 32
durability     = volatile
flush_interval = 16M
cut_after      = 256M    # floor: at least 256M written per cycle (not too short)
cut_jitter     = 256M    # + seeded random 0..256M, so each cycle cuts in [256M, 512M]
graceful_ratio = 0.0
cycles         = 0
pattern        = random
power_hook     = ./power-hook.usb-sim.sh

# Random seed: 0 = derive from time() and print it (varies each run);
# set a fixed value (e.g. 0xABCD1234) to reproduce a run byte-for-byte.
seed = 0
