# LARGE 1 MiB commands across a mix of power cuts (volatile durability).
ranges         = 0-8G
access         = seq
io_size        = 1M
qd             = 16
durability     = volatile
flush_interval = 64M
cut_after      = 512M
graceful_ratio = 0.5
cycles         = 0
pattern        = random
power_hook     = ./examples/power-hook.usb-sim.sh

# Random seed: 0 = derive from time() and print it (varies each run);
# set a fixed value (e.g. 0xABCD1234) to reproduce a run byte-for-byte.
seed = 0
