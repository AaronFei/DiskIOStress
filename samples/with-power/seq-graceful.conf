# SEQUENTIAL writes across GRACEFUL power cuts only (volatile durability).
# Run: sudo ./build/DiskIOStress /dev/sdX pcwrite --config=samples/with-power/seq-graceful.conf
ranges         = 0-4G
access         = seq
io_size        = 64K
qd             = 32
durability     = volatile
flush_interval = 16M
cut_after      = 256M
graceful_ratio = 1.0
cycles         = 0
pattern        = addr
power_hook     = ./examples/power-hook.usb-sim.sh

# Random seed: 0 = derive from time() and print it (varies each run);
# set a fixed value (e.g. 0xABCD1234) to reproduce a run byte-for-byte.
seed = 0
