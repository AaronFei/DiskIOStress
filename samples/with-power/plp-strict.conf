# PLP VALIDATION: assert every COMPLETED write survives an ungraceful cut.
# Tight checkpoint window so the unverifiable in-flight window stays small.
# A lost/reverted completed write is reported as FAIL.
ranges              = 0-4G
access              = random
io_size             = 64K
qd                  = 32
durability          = plp
checkpoint_interval = 256K
cut_after           = 256M
graceful_ratio      = 0.0
cycles              = 0
pattern             = addr
power_hook          = ./examples/power-hook.usb-sim.sh

# Random seed: 0 = derive from time() and print it (varies each run);
# set a fixed value (e.g. 0xABCD1234) to reproduce a run byte-for-byte.
seed = 0
