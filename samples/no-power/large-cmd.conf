# LARGE transfer per command (1 MiB) — max-size command stress.
# Lower queue depth since each command is big.
workload = seq_wrc
pattern  = random
io_size  = 1M
qd       = 16
ranges   = whole

# Random seed: 0 = derive from time() and print it (varies each run);
# set a fixed value (e.g. 0xABCD1234) to reproduce a run byte-for-byte.
seed = 0
