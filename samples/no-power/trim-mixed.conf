# TRIM MIXED: write -> verify -> TRIM the range, every pass (trim interleaved
# with I/O; the next pass rewrites the trimmed region). Uses generic BLKDISCARD,
# so it works on NVMe / SATA / USB (if the device/bridge supports discard).
workload = rand_wrc
pattern  = addr
io_size  = 64K
qd       = 32
ranges   = whole
trim     = 1

# Random seed: 0 = derive from time() and print it (varies each run);
# set a fixed value (e.g. 0xABCD1234) to reproduce a run byte-for-byte.
seed = 0
