# 4 KiB I/O, EVERY command 4K-UNALIGNED (offset by one sector, so each transfer
# straddles a 4K boundary -> exercises read-modify-write). Still 512-aligned for
# O_DIRECT. Each command sits in an 8K slot so offset commands never overlap.
workload   = rand_wrc
pattern    = addr
io_size    = 4K
qd         = 64
align      = 4K
align_mode = unaligned
# Offset from the 4K boundary. Default = 1 sector. Set a fixed value (e.g. 2K)
# or 'random' for a per-command random offset (reproducible via seed):
# align_offset = 2K
# align_offset = random

# Random seed: 0 = derive from time() and print it (varies each run);
# set a fixed value (e.g. 0xABCD1234) to reproduce a run byte-for-byte.
seed = 0
