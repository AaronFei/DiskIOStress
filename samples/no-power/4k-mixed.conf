# 4 KiB I/O, MIXED alignment: each command is deterministically either 4K-aligned
# or offset by one sector (so a single run exercises both aligned and unaligned
# transfers). The choice is reproducible, so read-back verify still matches.
workload   = rand_wrc
pattern    = addr
io_size    = 4K
qd         = 64
align      = 4K
align_mode = mixed

# Random seed: 0 = derive from time() and print it (varies each run);
# set a fixed value (e.g. 0xABCD1234) to reproduce a run byte-for-byte.
seed = 0
