# Read/WRITE MIX (read-heavy): each pass writes the region, then re-reads and
# verifies it twice.  NOTE: the engine runs a full write-pass then read-pass(es);
# it is NOT a concurrent R/W-ratio mix (that would be a future feature).
workload  = seq_wrrc
pattern   = random
io_size   = 64K
qd        = 32
ranges    = whole

# Random seed: 0 = derive from time() and print it (varies each run);
# set a fixed value (e.g. 0xABCD1234) to reproduce a run byte-for-byte.
seed = 0
