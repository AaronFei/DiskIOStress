# CONCURRENT READ/WRITE MIX. Pre-seeds the whole range once, then issues reads
# and writes *simultaneously* on the same io_uring queue at a fixed ratio.
# Reads scrub-verify (magic/LBA/CRC) whatever is on the media; a read and a write
# never target the same LBA at once. This stresses integrity UNDER read/write
# contention -- unlike the seq-verify/rand-verify workloads, which write a whole
# pass then read a whole pass (no overlap).
workload  = concurrent-rw
rw_ratio  = 70          # percent of ops that are reads (rest are writes)
pattern   = random
io_size   = 64K
qd        = 64
ranges    = whole

# Bound the run by time (recommended for concurrent-rw; it has no natural "pass" end).
# test_time = 10m

# Random seed: 0 = derive from time() and print it (varies each run);
# set a fixed value (e.g. 0xABCD1234) to replay the same read/write access order.
seed = 0
