# Basic RANDOM write -> read -> verify (full-coverage random order per pass).
# Run: sudo ./build/DiskIOStress --config=samples/no-power/rand-verify.conf /dev/sdX
workload  = rand-verify
pattern   = random
io_size   = 64K
qd        = 32
ranges    = whole
loops     = 1000000
test_time = 3600

# Random seed: 0 = derive from time() and print it (varies each run);
# set a fixed value (e.g. 0xABCD1234) to reproduce a run byte-for-byte.
seed = 0
